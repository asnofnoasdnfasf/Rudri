<button
  type="button"
  class="mesa-tile"
  [class.seleccionada]="seleccionada"
  [class.inactiva]="!mesa.activa"
  [disabled]="!mesa.activa"
  (click)="alHacerClick()"
>
  <div class="mesa-icon-wrap" aria-hidden="true">
    <!-- Ilustración SVG idéntica al Figma RUDRI (Mesa redonda vista superior con 4 sillas) -->
    <svg viewBox="0 0 80 80" width="54" height="54" fill="none">
      <!-- Silla Superior -->
      <rect x="29" y="6" width="22" height="7" rx="3.5" stroke="#5C4033" stroke-width="2.2" />
      <!-- Silla Inferior -->
      <rect x="29" y="67" width="22" height="7" rx="3.5" stroke="#5C4033" stroke-width="2.2" />
      <!-- Silla Izquierda -->
      <rect x="6" y="29" width="7" height="22" rx="3.5" stroke="#5C4033" stroke-width="2.2" />
      <!-- Silla Derecha -->
      <rect x="67" y="29" width="7" height="22" rx="3.5" stroke="#5C4033" stroke-width="2.2" />
      <!-- Tablero Circular de la Mesa -->
      <circle cx="40" cy="40" r="20" stroke="#5C4033" stroke-width="2.5" fill="#FFFDF9" />
    </svg>
  </div>

  <span class="mesa-label">
    {{ mesa.codigoFormateado || ('MESA ' + (mesa.numero < 10 ? '0' + mesa.numero : mesa.numero)) }}
  </span>
  <small class="mesa-cap">{{ mesa.capacidad }} personas</small>
</button>
